<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Planta SprayTech 2026</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--navy:#1A1A2E;--blue:#0F3460;--red:#E94560;--ok:#1D9E75;--warn:#BA7517;--danger:#E24B4A;--bg:#F0F2F5;--card:#fff;--border:#E5E5E5;--text:#222;--muted:#888}
html,body{height:100%;overflow:hidden;background:var(--bg);font-family:Arial,sans-serif;color:var(--text)}
.hdr{background:var(--navy);color:#fff;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;position:fixed;top:0;left:0;right:0;z-index:100;height:54px}
.hdr-title{font-size:14px;font-weight:700}.hdr-sub{font-size:10px;color:#8899BB;margin-top:1px}
.hdr-status{display:flex;align-items:center;gap:5px;flex-shrink:0}
#status-dot{width:8px;height:8px;border-radius:50%;background:#555;flex-shrink:0}
#status-txt{font-size:10px;color:#8899BB;white-space:nowrap}
.kpi-strip{position:fixed;top:54px;left:0;right:0;z-index:99;background:var(--card);border-bottom:1px solid var(--border);display:flex;overflow-x:auto;scrollbar-width:none}
.kpi-strip::-webkit-scrollbar{display:none}
.kpi{flex:0 0 auto;padding:6px 16px;text-align:center;border-right:1px solid var(--border)}
.kpi-label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}
.kpi-val{font-size:18px;font-weight:700;line-height:1.2}
.kpi-val.ok{color:var(--ok)}.kpi-val.warn{color:var(--warn)}.kpi-val.danger{color:var(--danger)}.kpi-val.blue{color:var(--blue)}
.legend-bar{position:fixed;top:94px;left:0;right:0;z-index:98;background:#F8F9FA;border-bottom:1px solid var(--border);padding:5px 14px;display:flex;gap:14px;overflow-x:auto;scrollbar-width:none;align-items:center}
.legend-bar::-webkit-scrollbar{display:none}
.leg{display:flex;align-items:center;gap:4px;font-size:10px;color:#555;white-space:nowrap;flex-shrink:0}
.leg-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.map-wrap{position:fixed;top:120px;left:0;right:0;bottom:0;overflow:hidden;background:var(--bg)}
#map-loading{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;color:var(--muted);font-size:13px}
.spinner{display:inline-block;width:20px;height:20px;border:2px solid #ddd;border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
#svg-container{transform-origin:0 0;will-change:transform;cursor:grab;user-select:none;padding:12px;display:none}
#svg-container:active{cursor:grabbing}
svg.plant{display:block;width:760px;height:460px;touch-action:none}
.equip{cursor:pointer}.equip:active>rect,.equip:active>ellipse{opacity:.7}
.equip.active>rect{stroke-width:3!important}
.zoom-ctrl{position:fixed;right:14px;bottom:180px;z-index:200;display:flex;flex-direction:column;gap:6px}
.zoom-btn{width:40px;height:40px;border-radius:50%;background:var(--card);border:1px solid var(--border);font-size:22px;color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.zoom-btn:active{background:#f0f0f0;transform:scale(.95)}
.sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:300;opacity:0;pointer-events:none;transition:opacity .25s}
.sheet-overlay.visible{opacity:1;pointer-events:all}
.bottom-sheet{position:fixed;left:0;right:0;bottom:0;z-index:400;background:var(--card);border-radius:20px 20px 0 0;transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);max-height:82vh;display:flex;flex-direction:column;box-shadow:0 -4px 24px rgba(0,0,0,.15)}
.bottom-sheet.open{transform:translateY(0)}
.sheet-handle{width:40px;height:4px;background:#ddd;border-radius:2px;margin:10px auto 0;flex-shrink:0}
.sheet-scroll{overflow-y:auto;flex:1;padding:0 16px 32px;-webkit-overflow-scrolling:touch}
.sheet-hdr{display:flex;align-items:flex-start;justify-content:space-between;padding:14px 0 12px;position:sticky;top:0;background:var(--card);z-index:1;border-bottom:1px solid var(--border);margin-bottom:12px}
.sheet-name{font-size:16px;font-weight:700;color:var(--navy);line-height:1.3}
.sheet-area{font-size:11px;color:var(--muted);margin-top:3px}
.sheet-close{width:32px;height:32px;border-radius:50%;background:#f5f5f5;border:none;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-left:10px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:4px 12px;border-radius:20px;margin-bottom:12px}
.badge.ok{background:#D4EDDA;color:#155724}.badge.warn{background:#FFF3CD;color:#856404}.badge.danger{background:#F8D7DA;color:#721C24}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.metric{background:#F8F9FA;border-radius:8px;padding:10px 12px}
.metric-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px}
.metric-val{font-size:15px;font-weight:700;color:var(--navy)}
.metric-val.ok{color:var(--ok)}.metric-val.warn{color:var(--warn)}.metric-val.danger{color:var(--danger)}
.hist-title{font-size:13px;font-weight:700;color:var(--navy);margin-bottom:10px}
.hist-card{background:#F8F9FA;border-radius:8px;padding:10px 12px;margin-bottom:8px}
.hist-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;gap:8px}
.hist-date{font-size:11px;color:var(--muted)}
.hist-tipo{font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;white-space:nowrap}
.tipo-pm{background:#D4EDDA;color:#155724}.tipo-cor{background:#F8D7DA;color:#721C24}.tipo-cal{background:#D1ECF1;color:#0C5460}
.hist-desc{font-size:12px;color:#333;line-height:1.5;margin-bottom:4px}
.hist-bottom{display:flex;align-items:center;justify-content:space-between}
.hist-tech{font-size:11px;color:var(--muted)}.hist-costo{font-size:11px;color:var(--warn);font-weight:700}
.no-hist{text-align:center;padding:20px;color:var(--muted);font-size:12px}
.hint-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:rgba(26,26,46,.85);color:#fff;font-size:12px;padding:8px 18px;border-radius:20px;z-index:200;white-space:nowrap;pointer-events:none;transition:opacity .5s}
.hint-toast.hidden{opacity:0}
@media(min-width:768px){
  .bottom-sheet{left:auto;right:20px;bottom:20px;border-radius:14px;max-height:75vh;width:380px;transform:translateX(120%)}
  .bottom-sheet.open{transform:translateX(0)}
  .sheet-overlay{display:none}
  .zoom-ctrl{bottom:220px}
}
</style>
</head>

  <g class="equip" data-id="WT-BOM" onclick="showEquip('WT-BOM')"><rect x="630" y="174" width="74" height="52" rx="4" fill="#C0DD97" stroke="#639922" stroke-width="1"/><text x="667" y="196" text-anchor="middle" font-size="8" font-weight="bold" fill="#173404">Bomba</text><text x="667" y="209" text-anchor="middle" font-size="8" fill="#27500A">Recirculac.</text><circle id="dot-WT-BOM" cx="695" cy="176" r="5" fill="#ccc"/></g>
  <rect x="372" y="234" width="330" height="14" rx="3" fill="#97C459" stroke="#3B6D11" stroke-width="0.5"/><text x="537" y="244" text-anchor="middle" font-size="8" fill="#173404">Linea de recirculacion de agua tratada</text>
  <rect x="8" y="294" width="704" height="58" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="1.2"/>
  <text x="360" y="308" text-anchor="middle" font-size="10" font-weight="bold" fill="#2C2C2A">Conveyor principal</text>
  <g class="equip" data-id="CONV-T1" onclick="showEquip('CONV-T1')"><rect x="18" y="314" width="80" height="22" rx="3" fill="#D3D1C7" stroke="#888780" stroke-width="0.5"/><text x="58" y="328" text-anchor="middle" font-size="8" fill="#2C2C2A">T1 Entrada</text><circle id="dot-CONV-T1" cx="90" cy="316" r="4" fill="#ccc"/></g>
  <g class="equip" data-id="CONV-T2" onclick="showEquip('CONV-T2')"><rect x="108" y="314" width="74" height="22" rx="3" fill="#D3D1C7" stroke="#888780" stroke-width="0.5"/><text x="145" y="328" text-anchor="middle" font-size="8" fill="#2C2C2A">Tramo 2</text><circle id="dot-CONV-T2" cx="174" cy="316" r="4" fill="#ccc"/></g>
  <g class="equip" data-id="CONV-T3" onclick="showEquip('CONV-T3')"><rect x="192" y="314" width="74" height="22" rx="3" fill="#D3D1C7" stroke="#888780" stroke-width="0.5"/><text x="229" y="328" text-anchor="middle" font-size="8" fill="#2C2C2A">Tramo 3</text><circle id="dot-CONV-T3" cx="258" cy="316" r="4" fill="#ccc"/></g>
  <g class="equip" data-id="CONV-T4" onclick="showEquip('CONV-T4')"><rect x="276" y="314" width="84" height="22" rx="3" fill="#D3D1C7" stroke="#888780" stroke-width="0.5"/><text x="318" y="328" text-anchor="middle" font-size="8" fill="#2C2C2A">T4 Centro</text><circle id="dot-CONV-T4" cx="352" cy="316" r="4" fill="#ccc"/></g>

  <g class="equip" data-id="CONV-T6" onclick="showEquip('CONV-T6')"><rect x="454" y="314" width="74" height="22" rx="3" fill="#D3D1C7" stroke="#888780" stroke-width="0.5"/><text x="491" y="328" text-anchor="middle" font-size="8" fill="#2C2C2A">Tramo 6</text><circle id="dot-CONV-T6" cx="520" cy="316" r="4" fill="#ccc"/></g>
  <g class="equip" data-id="CONV-T7" onclick="showEquip('CONV-T7')"><rect x="538" y="314" width="160" height="22" rx="3" fill="#D3D1C7" stroke="#888780" stroke-width="0.5"/><text x="618" y="328" text-anchor="middle" font-size="8" fill="#2C2C2A">T7 Salida</text><circle id="dot-CONV-T7" cx="690" cy="316" r="4" fill="#ccc"/></g>
  <text x="360" y="368" text-anchor="middle" font-size="9" fill="#BBBBBB">Washer -- Hornos -- Cooling -- Cabinas -- Descarga</text>
  </svg>
  </div>
</div>
<div class="zoom-ctrl">
  <button class="zoom-btn" onclick="zoomIn()">+</button>
  <button class="zoom-btn" onclick="zoomOut()">&#8722;</button>
  <button class="zoom-btn" onclick="resetZoom()" style="font-size:14px">&#8962;</button>
</div>
<div class="hint-toast" id="hint-toast">&#128072; Pellizca para zoom &middot; Toca un equipo</div>
<div class="sheet-overlay" id="overlay" onclick="closeSheet()"></div>
<div class="bottom-sheet" id="bottom-sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-scroll">
    <div class="sheet-hdr">
      <div><div class="sheet-name" id="s-name"></div><div class="sheet-area" id="s-area"></div></div>
      <button class="sheet-close" onclick="closeSheet()">&#10005;</button>
    </div>
    <span class="badge" id="s-badge"></span>
    <div class="metrics" id="s-metrics"></div>
    <div class="hist-title">&#128203; Historial de trabajos</div>
    <div id="s-hist"></div>
  </div>
</div>
<script>
const EU='https://raw.githubusercontent.com/raulseguraimt-ctrl/Mantenimiento-Cabina-Spraytech-2026/refs/heads/main/equipos.csv';
const HU='https://raw.githubusercontent.com/raulseguraimt-ctrl/Mantenimiento-Cabina-Spraytech-2026/refs/heads/main/historial.csv';
let eD={},hD={},aId=null;
const cont=document.getElementById('svg-container');
const wrap=document.getElementById('map-wrap');
let sc=1,px=0,py=0,pan=false,sx=0,sy=0,ld=0,pinch=false;
function applyT(){cont.style.transform=`translate(${px}px,${py}px) scale(${sc})`;}
function clamp(){const r=wrap.getBoundingClientRect();const mX=Math.max(0,760*sc-r.width+24);const mY=Math.max(0,460*sc-r.height+24);px=Math.min(0,Math.max(-mX,px));py=Math.min(0,Math.max(-mY,py));}
function zoomIn(){sc=Math.min(4,sc*1.3);clamp();applyT();}
function zoomOut(){sc=Math.max(0.5,sc/1.3);clamp();applyT();}
function resetZoom(){sc=1;px=0;py=0;applyT();}
wrap.addEventListener('touchstart',e=>{if(e.touches.length===2){pinch=true;pan=false;ld=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);}else if(e.touches.length===1){pan=true;pinch=false;sx=e.touches[0].clientX-px;sy=e.touches[0].clientY-py;}},{passive:true});
wrap.addEventListener('touchmove',e=>{if(pinch&&e.touches.length===2){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);sc=Math.min(4,Math.max(0.5,sc*(d/ld)));ld=d;clamp();applyT();}else if(pan&&e.touches.length===1){px=e.touches[0].clientX-sx;py=e.touches[0].clientY-sy;clamp();applyT();}},{passive:true});
wrap.addEventListener('touchend',e=>{if(e.touches.length<2)pinch=false;if(e.touches.length===0)pan=false;},{passive:true});
wrap.addEventListener('mousedown',e=>{if(e.target.closest('.equip'))return;pan=true;sx=e.clientX-px;sy=e.clientY-py;wrap.style.cursor='grabbing';});
window.addEventListener('mousemove',e=>{if(!pan)return;px=e.clientX-sx;py=e.clientY-sy;clamp();applyT();});
window.addEventListener('mouseup',()=>{pan=false;wrap.style.cursor='';});
wrap.addEventListener('wheel',e=>{e.preventDefault();sc=Math.min(4,Math.max(0.5,sc*(e.deltaY>0?0.85:1.18)));clamp();applyT();},{passive:false});
function parseCSV(t){const lines=t.trim().split('\n').map(l=>l.replace(/\r/,''));let hi=-1;for(let i=0;i<lines.length;i++){if(lines[i].startsWith('ID')){hi=i;break;}}if(hi<0)return[];const h=spl(lines[hi]);return lines.slice(hi+1).filter(l=>l.trim()).map(l=>{const v=spl(l),o={};h.forEach((k,i)=>o[k.trim()]=(v[i]||'').trim());return o;});}
function spl(l){const r=[];let c='',q=false;for(const ch of l){if(ch==='"'){q=!q;}else if(ch===','&&!q){r.push(c);c='';}else c+=ch;}r.push(c);return r;}
function pd(s){if(!s)return new Date(0);const p=s.split('/');if(p.length===3)return new Date(+p[2],+p[1]-1,+p[0]);return new Date(s);}
function sCol(e,d){if(!e)return'#888';if(e.toUpperCase().includes('VENC'))return'#E24B4A';const n=parseInt(d);if(!isNaN(n)&&n<=30)return'#BA7517';return'#1D9E75';}
function sCls(e,d){if(!e)return'';if(e.toUpperCase().includes('VENC'))return'danger';const n=parseInt(d);if(!isNaN(n)&&n<=30)return'warn';return'ok';}
async function loadData(){
  try{
    const[eR,hR]=await Promise.all([fetch(EU+'?t='+Date.now()),fetch(HU+'?t='+Date.now())]);
    parseCSV(await eR.text()).forEach(r=>{const id=r['ID Equipo']||r['ID_Equipo']||'';if(id)eD[id]=r;});
    parseCSV(await hR.text()).forEach(r=>{const id=r['ID_Equipo']||r['ID Equipo']||'';if(!id)return;if(!hD[id])hD[id]=[];hD[id].push(r);});
    Object.keys(hD).forEach(id=>hD[id].sort((a,b)=>pd(b['Fecha realización'])-pd(a['Fecha realizaci\u00f3n'])));
    document.querySelectorAll('[id^="dot-"]').forEach(dot=>{const id=dot.id.replace('dot-','');const eq=eD[id];if(!eq)return;dot.setAttribute('fill',sCol(eq['Estado']||'',(eq['D\u00edas restantes']||'').replace(' d\u00edas','')));});
    const all=Object.values(eD),total=all.length;let ok=0,w=0,dg=0;
    all.forEach(eq=>{const c=sCls(eq['Estado']||'',(eq['D\u00edas restantes']||'').replace(' d\u00edas',''));if(c==='ok')ok++;else if(c==='warn')w++;else dg++;});
    document.getElementById('kpi-total').textContent=total;
    document.getElementById('kpi-ok').textContent=ok;
    document.getElementById('kpi-warn').textContent=w;
    document.getElementById('kpi-danger').textContent=dg;
    document.getElementById('kpi-pct').textContent=total?Math.round((ok/total)*100)+'%':'--';
    document.getElementById('map-loading').style.display='none';
    cont.style.display='block';
    document.getElementById('status-dot').style.background='#1D9E75';
    document.getElementById('status-txt').textContent='En vivo';
    if(window.innerWidth<768){sc=0.62;px=0;py=0;applyT();}
    setTimeout(()=>document.getElementById('hint-toast').classList.add('hidden'),4000);
  }catch(e){
    document.getElementById('map-loading').innerHTML='Error al cargar datos';
    document.getElementById('status-dot').style.background='#E24B4A';
    document.getElementById('status-txt').textContent='Sin conexi\u00f3n';
  }
}
function showEquip(id){
  aId=id;const eq=eD[id];const hist=hD[id]||[];
  document.querySelectorAll('.equip').forEach(e=>e.classList.remove('active'));
  const el=document.querySelector('[data-id="'+id+'"]');if(el)el.classList.add('active');
  document.getElementById('s-name').textContent=eq?eq['Nombre']||id:id;
  document.getElementById('s-area').textContent=eq?'Area: '+(eq['\u00c1rea']||eq['Area']||'--')+'  \u00b7  '+(eq['Responsable']||'--'):'Sin datos en CSV';
  if(!eq){document.getElementById('s-badge').className='badge';document.getElementById('s-badge').textContent='Sin datos';document.getElementById('s-metrics').innerHTML='<div style="color:#aaa;font-size:12px;grid-column:1/-1">Agrega al Excel y sube el CSV.</div>';document.getElementById('s-hist').innerHTML='<div class="no-hist">Sin historial</div>';}
  else{
    const est=eq['Estado']||'';const dias=(eq['D\u00edas restantes']||'').replace(' d\u00edas','');const cls=sCls(est,dias);
    const badge=document.getElementById('s-badge');badge.className='badge '+cls;
    badge.textContent=est.includes('VENC')?'\ud83d\udd34 VENCIDO':cls==='warn'?'\u26a0\ufe0f PM pr\u00f3ximo':'\u2705 Al d\u00eda';
    const dn=parseInt(dias);const dc=est.includes('VENC')?'danger':(!isNaN(dn)&&dn<=30)?'warn':'ok';
    document.getElementById('s-metrics').innerHTML=`<div class="metric"><div class="metric-label">Ultimo PM</div><div class="metric-val">${eq['Último PM']||'--'}</div></div><div class="metric"><div class="metric-label">Proximo PM</div><div class="metric-val ${dc}">${eq['Pr\u00f3ximo PM']||'--'}</div></div><div class="metric"><div class="metric-label">Dias restantes</div><div class="metric-val ${dc}">${eq['D\u00edas restantes']||'--'}</div></div><div class="metric"><div class="metric-label">Trabajos</div><div class="metric-val">${hist.length}</div></div>`;
    document.getElementById('s-hist').innerHTML=hist.length===0?'<div class="no-hist">Sin historial registrado</div>':hist.map(h=>{const tp=h['Tipo PM']||h['Tipo']||'';const tc=tp.toLowerCase().includes('correctivo')?'tipo-cor':tp.toLowerCase().includes('calibra')?'tipo-cal':'tipo-pm';const co=parseFloat((h['Costo ($)']||h['Costo']||'').replace(/[$,]/g,''));return`<div class="hist-card"><div class="hist-top"><span class="hist-date">${h['Fecha realizaci\u00f3n']||h['Fecha']||'--'}</span><span class="hist-tipo ${tc}">${tp}</span></div><div class="hist-desc">${h['Descripci\u00f3n del trabajo']||h['Descripci\u00f3n']||'--'}</div><div class="hist-bottom"><span class="hist-tech">\ud83d\udc64 ${h['T\u00e9cnico']||'--'}</span>${co>0?`<span class="hist-costo">$${co.toLocaleString('es-MX')}</span>`:''}</div></div>`;}).join('');
  }
  document.getElementById('overlay').classList.add('visible');
  document.getElementById('bottom-sheet').classList.add('open');
}
function closeSheet(){document.getElementById('overlay').classList.remove('visible');document.getElementById('bottom-sheet').classList.remove('open');document.querySelectorAll('.equip').forEach(e=>e.classList.remove('active'));aId=null;}
const sh=document.getElementById('bottom-sheet');let shSY=0;
sh.addEventListener('touchstart',e=>{shSY=e.touches[0].clientY;},{passive:true});
sh.addEventListener('touchend',e=>{if(e.changedTouches[0].clientY-shSY>80)closeSheet();},{passive:true});
loadData();
setInterval(()=>{loadData();if(aId)setTimeout(()=>showEquip(aId),1500);},5*60*1000);
</script>
</body>
</html>
