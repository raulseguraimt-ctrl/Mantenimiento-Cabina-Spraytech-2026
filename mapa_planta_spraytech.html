<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>SprayTech 2026</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --ok:#1D9E75;--warn:#BA7517;--danger:#E24B4A;
  --w-fill:#E1F5EE;--w-stroke:#1D9E75;--w-dark:#085041;
  --d-fill:#FAEEDA;--d-stroke:#BA7517;--d-dark:#412402;
  --ca-fill:#EEEDFE;--ca-stroke:#534AB7;--ca-dark:#26215C;
  --cm-fill:#FBEAF0;--cm-stroke:#993556;--cm-dark:#4B1528;
  --cu-fill:#FFF3E0;--cu-stroke:#E65100;--cu-dark:#4A1A00;
  --co-fill:#E6F1FB;--co-stroke:#185FA5;--co-dark:#042C53;
}
html,body{height:100%;overflow:hidden;background:#F8F9FB;font-family:Arial,sans-serif;color:#222}

/* HEADER */
.hdr{background:#fff;border-bottom:1px solid #EEE;padding:0 16px;display:flex;align-items:center;justify-content:space-between;position:fixed;top:0;left:0;right:0;z-index:100;height:56px;gap:12px}
.hdr-logo{width:32px;height:32px;background:#1A1A2E;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.hdr-logo span{color:#fff;font-size:14px;font-weight:700}
.hdr-info{flex:1;min-width:0}
.hdr-title{font-size:14px;font-weight:700;color:#1A1A2E;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-sub{font-size:10px;color:#888;margin-top:1px}
.status-pill{display:flex;align-items:center;gap:5px;background:#F0F9F5;border:1px solid #C8EFDF;border-radius:20px;padding:4px 10px;flex-shrink:0}
#status-dot{width:7px;height:7px;border-radius:50%;background:#ccc}
#status-txt{font-size:10px;color:#555;white-space:nowrap}

/* KPI STRIP */
.kpi-strip{position:fixed;top:56px;left:0;right:0;z-index:99;background:#fff;border-bottom:1px solid #EEE;display:flex;overflow-x:auto;scrollbar-width:none}
.kpi-strip::-webkit-scrollbar{display:none}
.kpi{flex:0 0 auto;padding:8px 16px;text-align:center;border-right:1px solid #F0F0F0;min-width:72px}
.kpi-label{font-size:9px;color:#AAA;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;margin-bottom:2px}
.kpi-val{font-size:20px;font-weight:700;line-height:1}
.kpi-val.ok{color:var(--ok)}.kpi-val.warn{color:var(--warn)}.kpi-val.danger{color:var(--danger)}.kpi-val.blue{color:#0F3460}

/* LEGEND */
.legend-bar{position:fixed;top:98px;left:0;right:0;z-index:98;background:#FAFAFA;border-bottom:1px solid #EEE;padding:5px 16px;display:flex;gap:16px;overflow-x:auto;scrollbar-width:none;align-items:center}
.legend-bar::-webkit-scrollbar{display:none}
.leg{display:flex;align-items:center;gap:5px;font-size:10px;color:#666;white-space:nowrap;flex-shrink:0}
.leg-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

/* MAP */
.map-wrap{position:fixed;top:126px;left:0;right:0;bottom:0;overflow:hidden;background:#F4F5F8}
#map-loading{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;color:#AAA;font-size:13px}
.spinner{display:inline-block;width:20px;height:20px;border:2px solid #EEE;border-top-color:#0F3460;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
#svg-container{transform-origin:0 0;will-change:transform;cursor:grab;user-select:none;padding:14px;display:none}
#svg-container:active{cursor:grabbing}
svg.plant{display:block;width:900px;height:560px;touch-action:none}

/* AREA CARDS on SVG */
.area-card{filter:drop-shadow(0 2px 4px rgba(0,0,0,.06))}
.equip{cursor:pointer;transition:opacity .15s}
.equip:hover .eq-body{opacity:.88}
.equip.active .eq-body{stroke-width:2.5!important}

/* ZOOM */
.zoom-ctrl{position:fixed;right:14px;bottom:200px;z-index:200;display:flex;flex-direction:column;gap:8px}
.zoom-btn{width:40px;height:40px;border-radius:50%;background:#fff;border:1px solid #E5E5E5;font-size:20px;color:#333;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.zoom-btn:active{transform:scale(.94);background:#F5F5F5}

/* OVERLAY + SHEET */
.sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:300;opacity:0;pointer-events:none;transition:opacity .25s;backdrop-filter:blur(2px)}
.sheet-overlay.visible{opacity:1;pointer-events:all}
.bottom-sheet{position:fixed;left:0;right:0;bottom:0;z-index:400;background:#fff;border-radius:20px 20px 0 0;transform:translateY(100%);transition:transform .32s cubic-bezier(.4,0,.2,1);max-height:86vh;display:flex;flex-direction:column;box-shadow:0 -6px 30px rgba(0,0,0,.12)}
.bottom-sheet.open{transform:translateY(0)}
.sheet-handle{width:36px;height:4px;background:#DDD;border-radius:2px;margin:12px auto 0;flex-shrink:0}
.sheet-scroll{overflow-y:auto;flex:1;padding:0 18px 36px;-webkit-overflow-scrolling:touch}
.sheet-hdr{display:flex;align-items:flex-start;justify-content:space-between;padding:14px 0 12px;position:sticky;top:0;background:#fff;z-index:1;border-bottom:1px solid #F0F0F0;margin-bottom:12px;gap:12px}
.eq-icon-big{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:22px}
.sheet-name{font-size:16px;font-weight:700;color:#1A1A2E;line-height:1.3}
.sheet-area{font-size:11px;color:#888;margin-top:2px}
.sheet-close{width:30px;height:30px;border-radius:50%;background:#F5F5F5;border:none;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#555}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:5px 14px;border-radius:20px;margin-bottom:12px}
.badge.ok{background:#D4EDDA;color:#0F6E56}.badge.warn{background:#FFF3CD;color:#854F0B}.badge.danger{background:#FCEBEB;color:#A32D2D}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.metric{background:#F8F9FA;border-radius:10px;padding:12px 14px;border:1px solid #F0F0F0}
.metric-label{font-size:10px;color:#AAA;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.metric-val{font-size:15px;font-weight:700;color:#1A1A2E}
.metric-val.ok{color:var(--ok)}.metric-val.warn{color:var(--warn)}.metric-val.danger{color:var(--danger)}

/* GALLERY */
.img-gallery{margin-bottom:14px;border-radius:12px;overflow:hidden}
.img-main{width:100%;height:180px;object-fit:cover;display:block;background:#F0F0F0}
.img-thumbs{display:flex;gap:6px;padding:8px;background:#F8F8F8;overflow-x:auto;scrollbar-width:none}
.img-thumbs::-webkit-scrollbar{display:none}
.img-thumb{width:56px;height:56px;object-fit:cover;border-radius:8px;cursor:pointer;border:2px solid transparent;flex-shrink:0;transition:border-color .15s}
.img-thumb.active{border-color:#0F3460}
.img-none{background:#F8F9FA;border-radius:12px;height:70px;display:flex;align-items:center;justify-content:center;color:#CCC;font-size:11px;margin-bottom:14px;border:1px dashed #E5E5E5}

/* HISTORY */
.hist-title{font-size:13px;font-weight:700;color:#1A1A2E;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.hist-card{border:1px solid #F0F0F0;border-radius:10px;padding:12px 14px;margin-bottom:8px;background:#fff}
.hist-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;gap:8px}
.hist-date{font-size:11px;color:#AAA;font-weight:500}
.hist-tipo{font-size:10px;font-weight:700;padding:3px 9px;border-radius:10px;white-space:nowrap}
.tipo-pm{background:#D4EDDA;color:#0F6E56}.tipo-cor{background:#FCEBEB;color:#A32D2D}.tipo-cal{background:#E6F1FB;color:#0C447C}
.hist-desc{font-size:12px;color:#444;line-height:1.5;margin-bottom:6px}
.hist-bottom{display:flex;align-items:center;justify-content:space-between}
.hist-tech{font-size:11px;color:#AAA;display:flex;align-items:center;gap:4px}
.hist-costo{font-size:11px;color:var(--warn);font-weight:700;background:#FFF8EC;padding:2px 8px;border-radius:8px}
.no-hist{text-align:center;padding:20px;color:#CCC;font-size:12px}
.hint-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:rgba(26,26,46,.82);color:#fff;font-size:11px;padding:8px 18px;border-radius:20px;z-index:200;white-space:nowrap;pointer-events:none;transition:opacity .5s;letter-spacing:.2px}
.hint-toast.hidden{opacity:0}

@media(min-width:768px){
  .bottom-sheet{left:auto;right:20px;bottom:20px;border-radius:16px;max-height:78vh;width:400px;transform:translateX(130%)}
  .bottom-sheet.open{transform:translateX(0)}
  .sheet-overlay{display:none}
  .zoom-ctrl{bottom:240px}
}
</style>
</head>

<script>
const EU='https://raw.githubusercontent.com/raulseguraimt-ctrl/Mantenimiento-Cabina-Spraytech-2026/refs/heads/main/equipos.csv';
const HU='https://raw.githubusercontent.com/raulseguraimt-ctrl/Mantenimiento-Cabina-Spraytech-2026/refs/heads/main/historial.csv';
const REPO='https://raw.githubusercontent.com/raulseguraimt-ctrl/Mantenimiento-Cabina-Spraytech-2026/main';

const IMGS={
  'WASH-T01':[`${REPO}/imagenes/WASH-T01.jpeg`],
  'WASH-T02':[`${REPO}/imagenes/WASH-T02.jpeg`],
  'WASH-T03':[`${REPO}/imagenes/WASH-T03.jpeg`],
  'WASH-T04':[`${REPO}/imagenes/WASH-T04.jpeg`],
  'WASH-T05':[`${REPO}/imagenes/WASH-T05.jpeg`],
  'WASH-RO1':[`${REPO}/imagenes/WASH-R01.jpeg`],
  'AMU-01':[`${REPO}/imagenes/AMU-01.jpeg`],
  'CAB-AUTO':[`${REPO}/CAB-AUTO/CAB-AUTO1.jpeg`,`${REPO}/CAB-AUTO/CAB-AUTO2.jpeg`,`${REPO}/CAB-AUTO/CAB-AUTO3.jpeg`,`${REPO}/CAB-AUTO/CAB-AUTO4.jpeg`],
  'CAB-MAN':[`${REPO}/CAB-MAN/CAB-MAN1.jpeg`,`${REPO}/CAB-MAN/CAB-MAN2.jpeg`],
};

const ICONS={
  'WASH':'&#9719;','DRYO':'&#9830;','CAB':'&#11835;','CURE':'&#9830;','COOL':'&#9654;',
  'WASH-RO1':'&#128167;','CAB-PST':'&#10148;','CAB-ALI':'&#9881;','CAB-FILT':'&#11053;','CAB-PMAN':'&#10148;','WASH-EXT':'&#9654;'
};
const AREA_COLORS={
  'Washer System':'#E1F5EE','Dry Off':'#FAEEDA','Cabina Automatica':'#EEEDFE',
  'Cabina Manual':'#FBEAF0','Cure Oven':'#FFF3E0','Cooling Tunnel':'#E6F1FB'
};

let eD={},hD={},aId=null;
const cont=document.getElementById('svg-container');
const wrap=document.getElementById('map-wrap');
let sc=1,px=0,py=0,pan=false,sx=0,sy=0,ld=0,pinch=false;

function applyT(){cont.style.transform=`translate(${px}px,${py}px) scale(${sc})`;}
function clamp(){const r=wrap.getBoundingClientRect();const mX=Math.max(0,900*sc-r.width+28);const mY=Math.max(0,560*sc-r.height+28);px=Math.min(0,Math.max(-mX,px));py=Math.min(0,Math.max(-mY,py));}
function zoomIn(){sc=Math.min(4,sc*1.3);clamp();applyT();}
function zoomOut(){sc=Math.max(0.4,sc/1.3);clamp();applyT();}
function resetZoom(){sc=1;px=0;py=0;applyT();}

wrap.addEventListener('touchstart',e=>{if(e.touches.length===2){pinch=true;pan=false;ld=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);}else if(e.touches.length===1){pan=true;pinch=false;sx=e.touches[0].clientX-px;sy=e.touches[0].clientY-py;}},{passive:true});
wrap.addEventListener('touchmove',e=>{if(pinch&&e.touches.length===2){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);sc=Math.min(4,Math.max(0.4,sc*(d/ld)));ld=d;clamp();applyT();}else if(pan&&e.touches.length===1){px=e.touches[0].clientX-sx;py=e.touches[0].clientY-sy;clamp();applyT();}},{passive:true});
wrap.addEventListener('touchend',e=>{if(e.touches.length<2)pinch=false;if(e.touches.length===0)pan=false;},{passive:true});
wrap.addEventListener('mousedown',e=>{if(e.target.closest('.equip'))return;pan=true;sx=e.clientX-px;sy=e.clientY-py;wrap.style.cursor='grabbing';});
window.addEventListener('mousemove',e=>{if(!pan)return;px=e.clientX-sx;py=e.clientY-sy;clamp();applyT();});
window.addEventListener('mouseup',()=>{pan=false;wrap.style.cursor='';});
wrap.addEventListener('wheel',e=>{e.preventDefault();sc=Math.min(4,Math.max(0.4,sc*(e.deltaY>0?0.85:1.18)));clamp();applyT();},{passive:false});

function parseCSV(t){const lines=t.trim().split('\n').map(l=>l.replace(/\r/,''));let hi=-1;for(let i=0;i<lines.length;i++){if(lines[i].startsWith('ID')){hi=i;break;}}if(hi<0)return[];const h=spl(lines[hi]);return lines.slice(hi+1).filter(l=>l.trim()).map(l=>{const v=spl(l),o={};h.forEach((k,i)=>o[k.trim()]=(v[i]||'').trim());return o;});}
function spl(l){const r=[];let c='',q=false;for(const ch of l){if(ch==='"'){q=!q;}else if(ch===','&&!q){r.push(c);c='';}else c+=ch;}r.push(c);return r;}
function pd(s){if(!s)return new Date(0);const p=s.split('/');if(p.length===3)return new Date(+p[2],+p[1]-1,+p[0]);return new Date(s);}
function sCol(e,d){if(!e)return'#CCC';if(e.toUpperCase().includes('VENC'))return'#E24B4A';const n=parseInt(d);if(!isNaN(n)&&n<=30)return'#BA7517';return'#1D9E75';}
function sCls(e,d){if(!e)return'';if(e.toUpperCase().includes('VENC'))return'danger';const n=parseInt(d);if(!isNaN(n)&&n<=30)return'warn';return'ok';}

function buildGallery(id){
  const imgs=IMGS[id];
  if(!imgs||imgs.length===0)return'<div class="img-none">Sin foto disponible</div>';
  if(imgs.length===1)return`<div class="img-gallery"><img class="img-main" src="${imgs[0]}" onerror="this.parentElement.innerHTML='<div class=\\"img-none\\">Foto no disponible</div>'" alt="Foto"/></div>`;
  const thumbs=imgs.map((src,i)=>`<img class="img-thumb${i===0?' active':''}" src="${src}" onclick="switchImg(this,'${src}')" alt="Foto ${i+1}"/>`).join('');
  return`<div class="img-gallery"><img class="img-main" src="${imgs[0]}" onerror="this.src=''" alt="Foto"/><div class="img-thumbs">${thumbs}</div></div>`;
}
function switchImg(thumb,src){
  thumb.closest('.img-gallery').querySelector('.img-main').src=src;
  thumb.closest('.img-thumbs').querySelectorAll('.img-thumb').forEach(t=>t.classList.remove('active'));
  thumb.classList.add('active');
}

async function loadData(){
  try{
    const[eR,hR]=await Promise.all([fetch(EU+'?t='+Date.now()),fetch(HU+'?t='+Date.now())]);
    parseCSV(await eR.text()).forEach(r=>{const id=r['ID Equipo']||r['ID_Equipo']||'';if(id)eD[id]=r;});
    parseCSV(await hR.text()).forEach(r=>{const id=r['ID_Equipo']||r['ID Equipo']||'';if(!id)return;if(!hD[id])hD[id]=[];hD[id].push(r);});
    Object.keys(hD).forEach(id=>hD[id].sort((a,b)=>pd(b['Fecha realizaci\u00f3n'])-pd(a['Fecha realizaci\u00f3n'])));
    document.querySelectorAll('[id^="dot-"]').forEach(dot=>{const id=dot.id.replace('dot-','');const eq=eD[id];if(!eq)return;dot.setAttribute('fill',sCol(eq['Estado']||'',(eq['D\u00edas restantes']||'').replace(' dias','')));});
    const all=Object.values(eD),total=all.length;let ok=0,w=0,dg=0;
    all.forEach(eq=>{const c=sCls(eq['Estado']||'',(eq['D\u00edas restantes']||'').replace(' dias',''));if(c==='ok')ok++;else if(c==='warn')w++;else dg++;});
    document.getElementById('kpi-total').textContent=total;
    document.getElementById('kpi-ok').textContent=ok;
    document.getElementById('kpi-warn').textContent=w;
    document.getElementById('kpi-danger').textContent=dg;
    document.getElementById('kpi-pct').textContent=total?Math.round((ok/total)*100)+'%':'--';
    document.getElementById('map-loading').style.display='none';
    cont.style.display='block';
    document.getElementById('status-dot').style.background='#1D9E75';
    document.getElementById('status-txt').textContent='En vivo';
    if(window.innerWidth<768){sc=0.52;px=0;py=0;applyT();}
    setTimeout(()=>document.getElementById('hint-toast').classList.add('hidden'),4000);
  }catch(e){
    document.getElementById('map-loading').innerHTML='&#9888; Error al cargar';
    document.getElementById('status-dot').style.background='#E24B4A';
    document.getElementById('status-txt').textContent='Sin conexi\u00f3n';
  }
}

function getIcon(id){
  if(ICONS[id])return ICONS[id];
  const prefix=id.split('-')[0]+'-'+id.split('-')[1];
  if(ICONS[prefix])return ICONS[prefix];
  const p=id.split('-')[0];
  return ICONS[p]||'&#9881;';
}

function showEquip(id){
  aId=id;const eq=eD[id];const hist=hD[id]||[];
  document.querySelectorAll('.equip').forEach(e=>e.classList.remove('active'));
  const el=document.querySelector('[data-id="'+id+'"]');if(el)el.classList.add('active');

  const area=eq?eq['\u00c1rea']||eq['Area']||'':'' ;
  const areaColor=AREA_COLORS[area]||'#F0F0F0';
  document.getElementById('s-icon-bg').style.background=areaColor;
  document.getElementById('s-icon').innerHTML=getIcon(id);
  document.getElementById('s-name').textContent=eq?eq['Nombre']||id:id;
  document.getElementById('s-area').textContent=eq?area+'  \u00b7  Resp: '+(eq['Responsable']||'--'):'Sin datos en CSV';
  document.getElementById('s-gallery').innerHTML=buildGallery(id);

  if(!eq){
    document.getElementById('s-badge').className='badge';document.getElementById('s-badge').innerHTML='Sin datos';
    document.getElementById('s-metrics').innerHTML='<div style="color:#CCC;font-size:12px;grid-column:1/-1;padding:8px">Agrega al Excel y sube el CSV.</div>';
    document.getElementById('s-hist').innerHTML='<div class="no-hist">Sin historial</div>';
  }else{
    const est=eq['Estado']||'';const dias=(eq['D\u00edas restantes']||'').replace(' dias','');const cls=sCls(est,dias);
    const badge=document.getElementById('s-badge');badge.className='badge '+cls;
    badge.innerHTML=est.includes('VENC')?'&#128308; VENCIDO':cls==='warn'?'&#9888;&#65039; PM pr\u00f3ximo':'&#9989; Al d\u00eda';
    const dn=parseInt(dias);const dc=est.includes('VENC')?'danger':(!isNaN(dn)&&dn<=30)?'warn':'ok';
    document.getElementById('s-metrics').innerHTML=`
      <div class="metric"><div class="metric-label">Ultimo PM</div><div class="metric-val">${eq['Último PM']||'--'}</div></div>
      <div class="metric"><div class="metric-label">Proximo PM</div><div class="metric-val ${dc}">${eq['Pr\u00f3ximo PM']||'--'}</div></div>
      <div class="metric"><div class="metric-label">Dias restantes</div><div class="metric-val ${dc}">${eq['D\u00edas restantes']||'--'}</div></div>
      <div class="metric"><div class="metric-label">Trabajos registrados</div><div class="metric-val">${hist.length}</div></div>`;
    document.getElementById('s-hist').innerHTML=hist.length===0
      ?'<div class="no-hist">Sin historial registrado</div>'
      :hist.map(h=>{
        const tp=h['Tipo PM']||h['Tipo']||'';
        const tc=tp.toLowerCase().includes('correctivo')?'tipo-cor':tp.toLowerCase().includes('calibra')?'tipo-cal':'tipo-pm';
        const co=parseFloat((h['Costo ($)']||h['Costo']||'').replace(/[$,]/g,''));
        return`<div class="hist-card">
          <div class="hist-top"><span class="hist-date">${h['Fecha realizaci\u00f3n']||h['Fecha']||'--'}</span><span class="hist-tipo ${tc}">${tp}</span></div>
          <div class="hist-desc">${h['Descripci\u00f3n del trabajo']||h['Descripci\u00f3n']||'--'}</div>
          <div class="hist-bottom">
            <span class="hist-tech">&#128100; ${h['T\u00e9cnico']||'--'}</span>
            ${co>0?`<span class="hist-costo">$${co.toLocaleString('es-MX')}</span>`:''}
          </div></div>`;}).join('');
  }
  document.getElementById('overlay').classList.add('visible');
  document.getElementById('bottom-sheet').classList.add('open');
}

function closeSheet(){document.getElementById('overlay').classList.remove('visible');document.getElementById('bottom-sheet').classList.remove('open');document.querySelectorAll('.equip').forEach(e=>e.classList.remove('active'));aId=null;}
const sh=document.getElementById('bottom-sheet');let shSY=0;
sh.addEventListener('touchstart',e=>{shSY=e.touches[0].clientY;},{passive:true});
sh.addEventListener('touchend',e=>{if(e.changedTouches[0].clientY-shSY>80)closeSheet();},{passive:true});

loadData();
setInterval(()=>{loadData();if(aId)setTimeout(()=>showEquip(aId),1500);},5*60*1000);
</script>
</body>
